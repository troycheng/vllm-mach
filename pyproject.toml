[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "vllm-mach"
version = "0.1.1"
description = "Accelerated native MXFP6 inference for vLLM on SM120"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [{name = "Tong Cheng"}]
dependencies = ["vllm==0.29.0"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.urls]
Homepage = "https://github.com/troycheng/vllm-mach"
Repository = "https://github.com/troycheng/vllm-mach"
Issues = "https://github.com/troycheng/vllm-mach/issues"
Releases = "https://github.com/troycheng/vllm-mach/releases"
"MXFP6 SM120" = "https://github.com/Nekofish-L/mxfp6_sm120"

[project.entry-points."vllm.general_plugins"]
mach = "vllm_mach.plugin:register"

[project.scripts]
vllm-mach-install = "vllm_mach.mxfp6.install:main"
vllm-mach-serve = "vllm_mach.mxfp6.serve:main"
vllm-mach-mxfp8-serve = "vllm_mach.mxfp8.serve:main"
vllm-mach-mxfp8-prepare = "vllm_mach.mxfp8.prepare_model:main"
vllm-mach-mxfp8-bench = "vllm_mach.mxfp8.benchmark:main"
vllm-mach-mxfp8-2b-serve = "vllm_mach.mxfp8.two_b.serve:main"
vllm-mach-mxfp8-2b-prepare = "vllm_mach.mxfp8.two_b.model:main"
vllm-mach-fp8-serve = "vllm_mach.fp8.serve:main"
vllm-mach-fp8-install = "vllm_mach.fp8.install:main"
vllm-mach-fp8-bench = "vllm_mach.mxfp8.benchmark:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["vllm_mach*"]
exclude = ["vllm_mach.exl3*"]

[tool.setuptools.package-data]
"vllm_mach.mxfp6" = ["profile/*.patch", "profile/*.json", "gdn/*.cu"]
"vllm_mach.mxfp8" = ["data/*.json", "data/*.patch"]
"vllm_mach.mxfp8.two_b" = ["data/*.json"]
"vllm_mach.fp8" = ["data/*.json", "data/*.patch"]

[tool.pytest.ini_options]
testpaths = [
    "tests/test_mxfp8_2b_model.py",
    "tests/test_mxfp8_2b_gdn_cpu.py",
    "tests/test_mxfp8_2b_ba_graph_cpu.py",
    "tests/test_mxfp8_2b_profile_cpu.py",
    "tests/test_fp8_profile_cpu.py",
    "tests/test_fp8_compile_choices_cpu.py",
    "tests/test_fp8_linear_cpu.py",
    "tests/test_fp8_activation_cpu.py",
    "tests/test_fp8_attention_cpu.py",
    "tests/native_mxfp6",
    "tests/test_mxfp6_warmup.py",
    "tests/test_deployment.py",
    "tests/test_mxfp8_benchmark.py",
    "tests/test_mxfp8_compile_choices.py",
    "tests/test_mxfp8_deploy.py",
    "tests/test_mxfp8_gdn_cpu.py",
    "tests/test_mxfp8_graph_policy.py",
    "tests/test_mxfp8_head_cpu.py",
    "tests/test_mxfp8_install.py",
    "tests/test_mxfp8_kv_cpu.py",
    "tests/test_mxfp8_native_cpu.py",
    "tests/test_mxfp8_native_profile_cpu.py",
    "tests/test_mxfp8_prepare_model.py",
    "tests/test_mxfp8_profile_cpu.py",
    "tests/test_mxfp8_projection_transform.py",
    "tests/test_mxfp8_reconstruct_model.py",
]
