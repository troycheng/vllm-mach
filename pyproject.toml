[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "vllm-mach"
version = "0.1.0a2"
description = "EXL3 and MXFP6 runtime paths for vLLM"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [{name = "Tong Cheng"}]
dependencies = ["vllm==0.28.0"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.urls]
Homepage = "https://github.com/troycheng/vllm-mach"
Repository = "https://github.com/troycheng/vllm-mach"
Issues = "https://github.com/troycheng/vllm-mach/issues"
Releases = "https://github.com/troycheng/vllm-mach/releases"
"MXFP6 SM120" = "https://github.com/Nekofish-L/mxfp6_sm120"

[project.entry-points."vllm.general_plugins"]
mach = "vllm_mach.plugin:register"

[tool.setuptools.packages.find]
where = ["src"]
include = ["vllm_mach*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
